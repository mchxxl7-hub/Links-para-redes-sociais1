<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links para redes sociais</title>
    <link rel="stylesheet" href="perfil.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">
</head>

<body>
    <main>
        <div class="card">
            <div class="container-img">
                <img src="./img/foto-de-perfil1.jpg" height="100px" />
            </div>
            <h1 class="nome"> Leonardo michel</h1>
            <span class="meu-pais">Rio de Janeiro, Brasil</span>
            <span class="bio">"Desenvolvedor front-end e leitor ávido"</span>
            <div class="card-github socias">
                <a href="https://github.com/mchxxl7-hub" alt="link para o Github" target="_blank">Github
                    <i class="fa-brands fa-github"></i>
                </a>
            </div>
            <div class="card-github socias">
                <a href="https://wa.me/21975412624" target="_blank">whatsapp
                    <i class="fa-brands fa-whatsapp"></i>
                </a>
            </div>
            <div class="card-github socias">
                <a href="https://www.linkedin.com/in/leonardo-michel-b51131441/?isSelfProfile=true"
                    target="_blank">Linkedin
                    <i class="fa-brands fa-linkedin"></i>
                </a>
            </div>
            <div class="card-github socias">
                <a href="https://x.com/Davros_bx" alt="link para o twtitter" target="_blank">Twitter
                    <i class="fa-brands fa-x-twitter"></i>
                </a>
            </div>
            <div class="card-github socias">
                <a href="https://www.instagram.com/mchxxl7/" alt="link para o instagram" target="_blank">Instagram
                    <i class="fa-brands fa-instagram"></i>
                </a>
            </div>

    </main>
</body>

</html>
